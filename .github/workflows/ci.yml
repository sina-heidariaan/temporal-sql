name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 and 26 are not just newer runtimes: Node 26 enables Temporal
        # natively, so this exercises native Temporal alongside the polyfill.
        node: [18, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # @js-temporal/polyfill's `prepare` can leave dist/ empty; fail fast if so.
      - name: Verify polyfill resolves
        run: node -e "require.resolve('@js-temporal/polyfill')"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run attw

  consumers:
    # Proves the packed tarball works for real dependants (ESM, CJS, and types)
    # at both ends of the declared peerDependencies ranges. `npm test` only ever
    # exercises src/, so this is the gate that would catch a broken exports map.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        peers: [min, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-consumers.mjs --peers=${{ matrix.peers }}

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: temporal_sql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Presence of DATABASE_URL switches the integration round-trip tests on.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/temporal_sql_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generate the Prisma client so the @prisma/adapter-pg round-trip test runs.
      - run: npx prisma generate
      - run: npm test
